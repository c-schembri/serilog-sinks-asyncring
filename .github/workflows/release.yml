name: Release

# Push a tag like v1.2.3 (or v1.2.3-beta.1 for a prerelease) to test, publish to nuget.org and create a
# GitHub release. Publishing uses nuget.org trusted publishing, so no API key is stored in the repository:
# set up a trusted publishing policy for this repository and workflow on nuget.org, and set the NUGET_USER
# repository variable to the nuget.org account name.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: test
    # Windows, so the .NET Framework builds are included.
    runs-on: windows-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # nuget.org trusted publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pack
        shell: bash
        run: >
          dotnet pack src/Serilog.Sinks.AsyncRing -c Release -o artifacts
          -p:ContinuousIntegrationBuild=true -p:Version="${GITHUB_REF_NAME#v}"

      - name: Log in to nuget.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        shell: bash
        run: >
          dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg artifacts/*.snupkg \
            --title "$GITHUB_REF_NAME" --generate-notes $prerelease
